<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#favicon-gradient)" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Monogram / Code Symbol DT -->
  <path d="M 18 20 L 28 20 C 35 20 37 25 37 32 C 37 39 35 44 28 44 L 18 44 Z" fill="none" stroke="url(#favicon-gradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 38 20 L 50 20 M 44 20 L 44 44" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
