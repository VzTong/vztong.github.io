<!doctype html>
<html lang="vi" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Instant Redirect: GitHub Pages -> Cloudflare Pages -->
  <script>
    (function () {
      var targetOrigin = "https://vytong.pages.dev";
      if (window.location.hostname.endsWith("github.io")) {
        var cleanPath = window.location.pathname.replace(/^\/portfolio\/?/i, "/");
        var destination = targetOrigin + cleanPath + window.location.search + window.location.hash;
        window.location.replace(destination);
      }
    })();
  </script>

  <!-- Canonical URL -->
  <link rel="canonical" href="https://vytong.pages.dev/" />

  <!-- Bot & Crawler Defense Directives -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />

  <!-- SEO Meta Tags -->
  <title>Tống Nhã Vy | Software Engineer</title>
  <meta name="description"
    content="Portfolio của Tống Nhã Vy - Kỹ sư Phần mềm (Software Engineer) với thế mạnh chuyên sâu về Backend (.NET) và Frontend hiện đại (Vue.js)." />
  <meta name="author" content="Tống Nhã Vy" />
  <meta name="keywords"
    content="Software Engineer, Fullstack Developer, Backend Developer, C#, .NET, Vue.js, Portfolio, Vietnam" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vytong.pages.dev/" />
  <meta property="og:title" content="Tống Nhã Vy | Software Engineer" />
  <meta property="og:description"
    content="Portfolio của Tống Nhã Vy - Software Engineer với thế mạnh nòng cốt về Backend và hệ thống phân tán." />

  <!-- Favicon placeholder -->
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />

  <!-- Google Fonts: Inter (sans-serif) + JetBrains Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-slate-950 text-slate-100 font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
